server:
  port: 8084

spring:
  application:
    name: appointment-service
  datasource:
    url: jdbc:mysql://localhost:3306/medibook_appointment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: medibook_root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Service URLs for inter-service communication
services:
  schedule-service:
    url: http://localhost:8083

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.medibook.appointment: DEBUG
